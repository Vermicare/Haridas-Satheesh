name: Retail LT v2.8 TRAIN-only full-target baseline
on:
  push:
    branches: [research/retail-store-disjoint-v15-20261027]
    paths:
      - '.github/workflows/retail-lt-full-target-v28.yml'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_full_target_last_observed_v28.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_full_target_last_observed_v28.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test fictional-only last-observed contracts
        working-directory: benchmarks/retail-demand/observable_baseline
        run: python -B -m unittest -v test_freshretail_lt_full_target_last_observed_v28
  pinned-public-targets:
    needs: fictional-controls
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==20.0.0
      - name: Download publisher-pinned public TRAIN and EVAL
        shell: bash
        run: |
          set -euo pipefail
          base='https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-LT/resolve/01c3bb306415e09d3ccd2fe762f33eb3aeb2affd/data'
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 900 --silent --show-error "$base/train.parquet" -o "$RUNNER_TEMP/train.parquet"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 300 --silent --show-error "$base/eval.parquet" -o "$RUNNER_TEMP/eval.parquet"
          printf '%s  %s\n' 'e744c537ed16a8254c50f8456de7c5614866d4d8b6787e3cc3b67be02ea2f1e3' "$RUNNER_TEMP/train.parquet" | sha256sum --check
          printf '%s  %s\n' '370ca7f995d2a059744e1659eb681e60db694bec2f80a84252426afdd2b6d626' "$RUNNER_TEMP/eval.parquet" | sha256sum --check
      - name: Generate complete TRAIN-only last-observed predictions
        working-directory: benchmarks/retail-demand/observable_baseline
        shell: bash
        run: |
          set -euo pipefail
          python -B freshretail_lt_full_target_last_observed_v28.py --train "$RUNNER_TEMP/train.parquet" --eval "$RUNNER_TEMP/eval.parquet" --predictions "$RUNNER_TEMP/private-predictions.csv" --report "$RUNNER_TEMP/retail-v28-aggregate.json"
      - name: Independent full-target coverage gate, NOT a scorer
        working-directory: benchmarks/retail-demand/observable_baseline
        shell: bash
        run: |
          set -euo pipefail
          python -B freshretail_lt_full_target_gate_v27.py --eval "$RUNNER_TEMP/eval.parquet" --predictions "$RUNNER_TEMP/private-predictions.csv" --output "$RUNNER_TEMP/retail-v28-coverage.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          a=json.loads((p/'retail-v28-aggregate.json').read_text())
          b=json.loads((p/'retail-v28-coverage.json').read_text())
          assert a['result']['target_rows']==70000
          assert a['result']['evaluation_labels_read'] is False
          assert b['result']['coverage']=='PASS_FULL_TARGET_ONLY'
          assert b['result']['official_leaderboard_comparable'] is False
          print('AGGREGATE_ONLY',json.dumps({'coverage':b['result']['coverage'],'sha256':a['result']['csv_sha256'],'fallback':a['result']['zero_fallback_rows']},sort_keys=True))
          PY
      - name: Upload aggregate-only provenance; never predictions or raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-v28-aggregate-only
          path: |
            ${{ runner.temp }}/retail-v28-aggregate.json
            ${{ runner.temp }}/retail-v28-coverage.json
          if-no-files-found: warn
          retention-days: 14
