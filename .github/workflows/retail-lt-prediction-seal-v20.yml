name: Retail LT v2.0 TRAIN-only prediction seal (NO EVAL)
on:
  push:
    branches: [research/retail-store-disjoint-v15-20261027]
    paths:
      - '.github/workflows/retail-lt-prediction-seal-v20.yml'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_prediction_seal_v20.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_prediction_seal_v20.py'
  pull_request:
    paths:
      - '.github/workflows/retail-lt-prediction-seal-v20.yml'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_prediction_seal_v20.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_prediction_seal_v20.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Seventeen fictional prediction-seal negative controls
        working-directory: benchmarks/retail-demand/observable_baseline
        run: python -B -m unittest -v test_freshretail_lt_prediction_seal_v20
  publisher-train-only:
    runs-on: ubuntu-latest
    needs: fictional-contracts
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==20.0.0
      - name: Download only publisher TRAIN; never EVAL
        shell: bash
        run: |
          set -euo pipefail
          root='https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-LT/resolve/01c3bb306415e09d3ccd2fe762f33eb3aeb2affd/data'
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 900 --silent --show-error "$root/train.parquet" -o "$RUNNER_TEMP/lt_train.parquet"
          printf '%s  %s\n' 'e744c537ed16a8254c50f8456de7c5614866d4d8b6787e3cc3b67be02ea2f1e3' "$RUNNER_TEMP/lt_train.parquet" | sha256sum --check
      - name: Seal all four frozen forecasts before EVAL access
        working-directory: benchmarks/retail-demand/observable_baseline
        shell: bash
        run: |
          set -euo pipefail
          python -B freshretail_lt_prediction_seal_v20.py --train "$RUNNER_TEMP/lt_train.parquet" --output "$RUNNER_TEMP/lt_predictions_seal_v20.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'lt_predictions_seal_v20.json').read_text())
          assert r['evaluation_labels_read'] is False and r['evaluation_file_opened'] is False
          assert r['cohort']['selected_cohort_sha256'] == 'dc128d3bed90035214c80529bf58e685ad7d49c717d95bd10c30c2b9407ca016'
          assert r['predicted_series'] == 512 and r['predicted_days'] == 3584
          assert r['forecast_accuracy'] == 'TBD'
          print('TRAIN-only predictions sealed:',r['prediction_sha256'])
          PY
      - name: Upload aggregate-only SHA commitment; no raw predictions or EVAL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-lt-v20-train-prediction-seal
          path: ${{ runner.temp }}/lt_predictions_seal_v20.json
          if-no-files-found: warn
          retention-days: 14
