name: WBI A04T exception-aware public metadata preflight
on:
  push:
    branches: [research/wbi-independent-repro-20261026]
    paths:
      - 'benchmarks/wireless-brain-interface/bnci_a04t_exception_v05.py'
      - 'benchmarks/wireless-brain-interface/test_bnci_a04t_exception_v05.py'
      - '.github/workflows/wbi-a04t-exception-v05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a04t-training-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned MAT reader
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2
      - name: Synthetic exception-aware metadata contract regressions
        working-directory: benchmarks/wireless-brain-interface
        run: python -B -m unittest -v test_bnci_a04t_exception_v05
      - name: Inspect official A04T training file; preserve metadata only
        run: >-
          python -B benchmarks/wireless-brain-interface/bnci_a04t_exception_v05.py
          --output "$RUNNER_TEMP/bnci_A04T_metadata_only.json"
      - name: Upload metadata only, never EEG samples or class labels
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bnci-A04T-training-metadata-only
          path: ${{ runner.temp }}/bnci_A04T_metadata_only.json
          retention-days: 14
          if-no-files-found: error
