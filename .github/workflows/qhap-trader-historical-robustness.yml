name: QHAP-TRADER Pinned 2021 Historical Robustness

on:
  pull_request:
    paths:
      - 'projects/qhap-trader/experiments/historical_day_robustness.mjs'
      - 'projects/qhap-trader/experiments/test_historical_day_robustness.mjs'
      - '.github/workflows/qhap-trader-historical-robustness.yml'
  push:
    paths:
      - 'projects/qhap-trader/experiments/historical_day_robustness.mjs'
      - 'projects/qhap-trader/experiments/test_historical_day_robustness.mjs'
      - '.github/workflows/qhap-trader-historical-robustness.yml'

permissions:
  contents: read

jobs:
  historical-day-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic diagnostics tests (no data download)
        run: node --test projects/qhap-trader/experiments/test_historical_day_robustness.mjs

      - name: Fetch exactly 24 pinned third-party source text files into ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/qhap-replay-source"
          mkdir -p "$root"
          manifest="projects/qhap-trader/experiments/SOURCE_BLOBS_FEB2021.tsv"
          upstream_commit="c95d7f187c2a317ca6a2287148cf10c50a80e928"
          checked=0
          while read -r symbol day sha; do
            if [[ -z "${symbol:-}" || "$symbol" == \#* ]]; then continue; fi
            if [[ ! "$symbol" =~ ^(ACC|RELIANCE)$ || ! "$day" =~ ^[0-9]{2}$ || ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::Invalid source manifest entry"; exit 1
            fi
            rel="2021/FEB/${day}FEB/${day}FEB/${symbol}.txt"
            target="$root/$rel"
            mkdir -p "$(dirname "$target")"
            url="https://raw.githubusercontent.com/gsidhu/nse-intraday-data/$upstream_commit/$rel"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 "$url" -o "$target"
            got="$(git hash-object "$target")"
            if [[ "$got" != "$sha" ]]; then
              echo "::error::Historical source blob mismatch"; exit 1
            fi
            checked=$((checked+1))
          done < "$manifest"
          test "$checked" -eq 24
          echo "Verified ${checked}/24 pinned historical source Git blobs. Raw candles are temporary only."

      - name: Reproduce prior historical snapshot then run day-block robustness analysis
        shell: bash
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP}/qhap-replay-source"
          exp="projects/qhap-trader/experiments"
          node "$exp/costed_intraday_pilot.mjs" "$base" 5 > "$RUNNER_TEMP/qhap-5.json"
          node "$exp/costed_intraday_pilot.mjs" "$base" 15 > "$RUNNER_TEMP/qhap-15.json"
          node "$exp/assert_historical_snapshot.mjs" "$RUNNER_TEMP/qhap-5.json" "$RUNNER_TEMP/qhap-15.json"
          node "$exp/historical_day_robustness.mjs" "$RUNNER_TEMP/qhap-5.json" "$RUNNER_TEMP/qhap-15.json" > "$RUNNER_TEMP/robustness.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(x.futurePredictiveEvidence!==false||x.untouchedHoldout!==false||
              x.brokerExecutedTrades!==0||x.marketDataRedistributed!==false)
              throw Error("Research classification corrupted");
            for(const [symbol,s] of Object.entries(x.analyzedSymbols)){
              for(const slip of ["5","15"]){
                for(const strategy of ["BASELINE","DTT_VETO"]){
                  const o=s.scenarios[slip][strategy];
                  console.log(JSON.stringify({
                    symbol,sideSlippageBps:Number(slip),strategy,
                    historicalSessions:o.dayCount,trades:o.trades,netInr:o.netPnlInr,
                    leaveOneDayOutInr:o.leaveOneDayOutRangeInr,
                    bootstrap95Inr:o.bootstrap.interval95ForTwelveSessionSum,
                    bootstrapReplicates:o.bootstrap.repetitions
                  }));
                }
                console.log(JSON.stringify({
                  symbol,sideSlippageBps:Number(slip),
                  policyDifferenceDttMinusBaselineInr:s.policyComparison[slip].netDifferenceInr,
                  pairedBootstrap95Inr:s.policyComparison[slip].bootstrap.interval95ForTwelveSessionSum
                }));
              }
            }
            console.log("CLASSIFICATION: Exploratory 12-day development sample; no market-data redistribution, no broker, no forward evidence.");
          ' "$RUNNER_TEMP/robustness.json"
      - name: Data rights and research safety notice
        run: |
          echo 'No raw historical data artifact, market-data license assurance, strategy auto-promotion, broker order or trade.'
          echo 'Historic 2021 source provenance and exchange fidelity remain unverified.'
