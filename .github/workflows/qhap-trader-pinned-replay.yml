name: QHAP-TRADER Pinned Historical Replay

on:
  pull_request:
    paths:
      - 'projects/qhap-trader/experiments/SOURCE_BLOBS_FEB2021.tsv'
      - 'projects/qhap-trader/experiments/assert_historical_snapshot.mjs'
      - 'projects/qhap-trader/experiments/costed_intraday_pilot.mjs'
      - 'projects/qhap-trader/experiments/guarded_paper_replay.mjs'
      - 'projects/qhap-trader/experiments/guarded_paper_replay_cli.mjs'
      - '.github/workflows/qhap-trader-pinned-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned public source files temporarily and verify exact Git blobs
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/qhap-replay-source"
          mkdir -p "$root"
          manifest="projects/qhap-trader/experiments/SOURCE_BLOBS_FEB2021.tsv"
          upstream_commit="c95d7f187c2a317ca6a2287148cf10c50a80e928"
          checked=0
          while read -r symbol day sha; do
            if [[ -z "${symbol:-}" || "$symbol" == \#* ]]; then continue; fi
            if [[ ! "$symbol" =~ ^(ACC|RELIANCE)$ || ! "$day" =~ ^[0-9]{2}$ || ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::Bad source manifest row"; exit 1
            fi
            rel="2021/FEB/${day}FEB/${day}FEB/${symbol}.txt"
            target="$root/$rel"
            mkdir -p "$(dirname "$target")"
            url="https://raw.githubusercontent.com/gsidhu/nse-intraday-data/$upstream_commit/$rel"
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 60 "$url" -o "$target"
            got="$(git hash-object "$target")"
            if [[ "$got" != "$sha" ]]; then
              echo "::error::Source content changed at $symbol $day: $got != $sha"; exit 1
            fi
            checked=$((checked+1))
          done < "$manifest"
          test "$checked" -eq 24
          echo "Pinned third-party stock-day files verified: $checked. Original candles are not persisted as artifacts."
      - name: Run exact historical replay from CLI, 5 and 15 bps per side
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/qhap-replay-source"
          node projects/qhap-trader/experiments/costed_intraday_pilot.mjs "$source_dir" 5 > "${RUNNER_TEMP}/qhap-5.json"
          node projects/qhap-trader/experiments/costed_intraday_pilot.mjs "$source_dir" 15 > "${RUNNER_TEMP}/qhap-15.json"
          node projects/qhap-trader/experiments/assert_historical_snapshot.mjs "${RUNNER_TEMP}/qhap-5.json" "${RUNNER_TEMP}/qhap-15.json"
          sha256sum "${RUNNER_TEMP}/qhap-5.json" "${RUNNER_TEMP}/qhap-15.json"
          echo "NOTICE: This is a deterministic regression of an exploratory development sample, NOT a statistically valid profitable trading claim."
      - name: Run new fail-closed stateful paper replay (exploratory only)
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/qhap-replay-source"
          node projects/qhap-trader/experiments/guarded_paper_replay_cli.mjs "$source_dir" 5 > "${RUNNER_TEMP}/guarded-5.json"
          node projects/qhap-trader/experiments/guarded_paper_replay_cli.mjs "$source_dir" 15 > "${RUNNER_TEMP}/guarded-15.json"
          node - "${RUNNER_TEMP}/guarded-5.json" "${RUNNER_TEMP}/guarded-15.json" <<'NODE'
          const fs=require("node:fs");
          for(const filename of process.argv.slice(2)){
            const run=JSON.parse(fs.readFileSync(filename,"utf8"));
            if(run.results.length!==4)throw Error("Expected two stocks and two variants");
            for(const r of run.results){
              if(!r.certified||r.unresolvedPositions!==0||r.ledger.length!==12||
                 !Number.isFinite(r.knownRealizedPnl))
                throw Error("Failed to certify complete historical replay for "+r.symbol+" "+r.variant);
              console.log("GUARDED_REPLAY",r.symbol,r.variant,
                "slippage_bps",r.slippageBps,
                "net_INR",r.knownRealizedPnl,
                "closed_trades",r.closedTrades,
                "state",JSON.stringify(r.stateSummary));
            }
          }
          console.log("Exploratory data only: passing complete-day replay does NOT prove real fills or profitability.");
          NODE
          sha256sum "${RUNNER_TEMP}/guarded-5.json" "${RUNNER_TEMP}/guarded-15.json"
      - name: Privacy and licensing boundary
        run: |
          echo "Third-party source bytes remain temporary; no uploads or artifacts."
          echo "Data-use rights and NSE fidelity remain independently unverified; no live trades."
