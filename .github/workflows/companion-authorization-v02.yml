name: Companion synthetic authorization negative controls

on:
  push:
    paths:
      - "benchmarks/companion-life-os/**"
      - ".github/workflows/companion-authorization-v02.yml"
  pull_request:
    paths:
      - "benchmarks/companion-life-os/**"
      - ".github/workflows/companion-authorization-v02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fictional-authorization:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reproduce fictional authorization, correction, outbox and sink-integrity tests
        working-directory: benchmarks/companion-life-os
        run: python -m unittest -v test_authorization_guard_v02 test_authorization_store_v03 test_correction_ledger_v05 test_actual_receipt_integration_v06 test_fictional_outbox_v07 test_fictional_sink_integrity_v09 test_sandbox_issuer_v10 test_revocable_signed_boundary_v11 test_process_kill_v12 test_revocation_outbox_gap_v13 test_atomic_revocation_delivery_v14 test_atomic_process_kill_v15
      - name: Generate fictional machine-readable demos
        working-directory: benchmarks/companion-life-os
        run: |
          python demo_authorization_guard_v02.py > demo-v02.json
          python demo_authorization_store_v03.py > demo-v03.json
          python demo_correction_ledger_v05.py > demo-v05.json
          python demo_actual_receipt_integration_v06.py > demo-v06.json
          python demo_fictional_outbox_v07.py > demo-v07.json
          python demo_sandbox_issuer_v10.py > demo-v10.json
          python demo_revocable_signed_boundary_v11.py > demo-v11.json
          python demo_process_kill_v12.py > demo-v12.json
          python demo_revocation_outbox_gap_v13.py > demo-v13.json
          python demo_atomic_revocation_delivery_v14.py > demo-v14.json
          python demo_atomic_process_kill_v15.py > demo-v15.json
      - uses: actions/upload-artifact@v4
        with:
          name: companion-authorization-${{ matrix.os }}
          path: |
            benchmarks/companion-life-os/demo-v02.json
            benchmarks/companion-life-os/demo-v03.json
            benchmarks/companion-life-os/demo-v05.json
            benchmarks/companion-life-os/demo-v06.json
            benchmarks/companion-life-os/demo-v07.json
            benchmarks/companion-life-os/demo-v10.json
            benchmarks/companion-life-os/demo-v11.json
            benchmarks/companion-life-os/demo-v12.json
            benchmarks/companion-life-os/demo-v13.json
            benchmarks/companion-life-os/demo-v14.json
            benchmarks/companion-life-os/demo-v15.json
