name: WBI A01T training-only exploratory decoder v0.9
on:
  push:
    branches: [research/wbi-independent-repro-20261026]
    paths:
      - 'benchmarks/wireless-brain-interface/bnci_a01t_training_run_pilot_v09.py'
      - 'benchmarks/wireless-brain-interface/test_bnci_a01t_training_run_pilot_v09.py'
      - '.github/workflows/wbi-a01t-training-only-pilot-v09.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-contract-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned decoder dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 scikit-learn==1.7.2
      - name: Fictional-only adversarial tests
        working-directory: benchmarks/wireless-brain-interface
        run: python -B -m unittest -v test_bnci_a01t_training_run_pilot_v09
  public-training-only-eeg-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: fictional-contract-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned decoder dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 scikit-learn==1.7.2
      - name: Decode public A01T training runs only; never A01E
        run: >-
          python -B benchmarks/wireless-brain-interface/bnci_a01t_training_run_pilot_v09.py
          --output "${{ runner.temp }}/wbi_a01t_training_only_v09_aggregate.json"
      - name: Upload aggregate metrics only; no EEG or trial-level output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wbi-a01t-training-only-aggregate-v09
          path: ${{ runner.temp }}/wbi_a01t_training_only_v09_aggregate.json
          retention-days: 14
          if-no-files-found: error
