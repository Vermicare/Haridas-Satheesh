name: WBI independent EDF+ annotation agreement

on:
  pull_request:
    paths:
      - "benchmarks/wireless-brain-interface/independent_edf_annotation_review.py"
      - "benchmarks/wireless-brain-interface/test_independent_edf_annotation_review.py"
      - "benchmarks/wireless-brain-interface/edf_annotation_contract.py"
      - ".github/workflows/wbi-independent-edf-review.yml"
  workflow_dispatch:

concurrency:
  group: wbi-independent-edf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  independent-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fictional comparator negative controls
        run: python -m unittest discover -s benchmarks/wireless-brain-interface -p test_independent_edf_annotation_review.py -v
      - name: Install pinned independent reader
        run: |
          python -m pip install --disable-pip-version-check "mne==1.13.2"
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/reader-dependencies.txt"
      - name: Acquire one pinned training EDF and publisher index only
        shell: bash
        run: |
          set -euo pipefail
          S3="s3://physionet-open/eegmmidb/1.0.0"
          timeout 180s aws s3 cp --no-sign-request --region us-east-1 --only-show-errors "$S3/S001/S001R04.edf" "$RUNNER_TEMP/S001R04.edf"
          timeout 60s aws s3 cp --no-sign-request --region us-east-1 --only-show-errors "$S3/SHA256SUMS.txt" "$RUNNER_TEMP/SHA256SUMS.txt"
          test "$(stat -c %s "$RUNNER_TEMP/S001R04.edf")" -le 8388608
          test "$(stat -c %s "$RUNNER_TEMP/SHA256SUMS.txt")" -le 524288
      - name: Compare ALL EDF+ task labels, onsets and durations against MNE
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/wireless-brain-interface/independent_edf_annotation_review.py \
            --edf "$RUNNER_TEMP/S001R04.edf" \
            --sha256-index "$RUNNER_TEMP/SHA256SUMS.txt" \
            --out "$RUNNER_TEMP/wbi-independent-annotation-review.json"
          python - <<'PY'
          import hashlib, json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "wbi-independent-annotation-review.json"
          result = json.loads(p.read_text())
          assert result["status"] == "PASS_INDEPENDENT_EDF_ANNOTATION_AGREEMENT"
          assert result["agreement"]["counts"] == {"T0": 15, "T1": 8, "T2": 7}
          assert result["agreement"]["total_events"] == 30
          assert not result["decoder_trained"] and not result["held_out_subjects_accessed"]
          print("Metadata-only report SHA256:", hashlib.sha256(p.read_bytes()).hexdigest())
          print("Maximum onset/duration delta (s):", result["agreement"]["max_onset_delta_s"], result["agreement"]["max_duration_delta_s"])
          PY
      - name: Preserve only metadata and dependency versions (not raw EEG)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wbi-independent-edf-annotation-agreement
          path: |
            ${{ runner.temp }}/wbi-independent-annotation-review.json
            ${{ runner.temp }}/reader-dependencies.txt
          retention-days: 14
