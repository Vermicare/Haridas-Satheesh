name: IoT capture preflight (synthetic contract)
on:
  pull_request:
    paths:
      - 'benchmarks/hardware-iot/**'
      - '.github/workflows/iot-capture-preflight.yml'
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic contract tests
        working-directory: benchmarks/hardware-iot
        run: python -m unittest -v test_capture_preflight.py
