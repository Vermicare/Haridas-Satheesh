name: Companion Life OS benchmark

on:
  push:
    paths:
      - "benchmarks/companion-life-os/**"
      - ".github/workflows/companion-life-os.yml"
  pull_request:
    paths:
      - "benchmarks/companion-life-os/**"
      - ".github/workflows/companion-life-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic synthetic benchmark
        run: |
          mkdir -p benchmark-results
          python benchmarks/companion-life-os/validator.py benchmarks/companion-life-os/scenario.json | tee benchmark-results/companion-life-os.json
      - name: Upload machine-readable result
        uses: actions/upload-artifact@v4
        with:
          name: companion-life-os-benchmark
          path: benchmark-results/companion-life-os.json
