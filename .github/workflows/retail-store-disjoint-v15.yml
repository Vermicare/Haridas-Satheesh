name: Retail v1.5 store-disjoint series transfer (same dates)
on:
  push:
    branches:
      - research/retail-store-disjoint-v15-20261027
    paths:
      - '.github/workflows/retail-store-disjoint-v15.yml'
      - 'benchmarks/retail-demand/observable_baseline/store_disjoint_v15.py'
      - 'benchmarks/retail-demand/observable_baseline/test_store_disjoint_v15.py'
  pull_request:
    paths:
      - '.github/workflows/retail-store-disjoint-v15.yml'
      - 'benchmarks/retail-demand/observable_baseline/store_disjoint_v15.py'
      - 'benchmarks/retail-demand/observable_baseline/test_store_disjoint_v15.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-disjoint-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run fictional contract tests before accessing publisher evaluation
        working-directory: benchmarks/retail-demand/observable_baseline
        run: python -B -m unittest -v test_official_holdout_v12 test_weekday_median_v14 test_store_disjoint_v15
      - name: Pin frozen previous evaluators
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:benchmarks/retail-demand/observable_baseline/official_holdout_v12.py)" = ddd12a4e0695c474f752d98c99fd781931373bce
          test "$(git rev-parse HEAD:benchmarks/retail-demand/observable_baseline/weekday_median_v14.py)" = 6e2e59a847ed5f9d568ca093b5f3aa88a875ada1
      - name: Install exact Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==20.0.0
      - name: Fetch official train and evaluation bytes; require original SHA-256
        shell: bash
        run: |
          set -euo pipefail
          root='https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-50K/resolve/08c1fab7f9257bc73679d415d644165d351d4/data'
          for split in train eval; do
            if curl --fail --location --retry 1 --connect-timeout 20 --max-time 900 "$root/$split.parquet" --output "$RUNNER_TEMP/$split.parquet"; then
              echo "$split pinned revision fetched"
            else
              echo "::warning::$split immutable URL unavailable; main fallback permitted only with frozen SHA-256"
              curl --fail --location --retry 2 --connect-timeout 20 --max-time 900 "https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-50K/resolve/main/data/$split.parquet" --output "$RUNNER_TEMP/$split.parquet"
            fi
          done
          printf '%s  %s\n' '6706832db892bbae4969c19d87e07975d2543d2ba7d7d4756360654785de5a3d' "$RUNNER_TEMP/train.parquet" | sha256sum --check
          printf '%s  %s\n' '1b118840664280c6b88bffc84c80ee1f54c05d911e354b7599e5da10995e960e' "$RUNNER_TEMP/eval.parquet" | sha256sum --check
      - name: Run one predeclared store-disjoint evaluation (no reranking on outcomes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -B benchmarks/retail-demand/observable_baseline/store_disjoint_v15.py --train "$RUNNER_TEMP/train.parquet" --eval "$RUNNER_TEMP/eval.parquet" --output artifacts/store_disjoint_v15_result.json
      - name: Write aggregate-only provenance even when evaluation fails
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          root=Path('artifacts'); root.mkdir(exist_ok=True)
          result=root/'store_disjoint_v15_result.json'
          def blob(path):
              return subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          data={
              'experiment_id':'retail-store-disjoint-transfer-v15',
              'run_id':os.environ.get('GITHUB_RUN_ID','TBD'),
              'commit':os.environ.get('GITHUB_SHA','TBD'),
              'python':sys.version,'platform':platform.platform(),
              'pyarrow_pin':'20.0.0',
              'new_source_blob':blob('benchmarks/retail-demand/observable_baseline/store_disjoint_v15.py'),
              'frozen_v14_blob':blob('benchmarks/retail-demand/observable_baseline/weekday_median_v14.py'),
              'frozen_v12_blob':blob('benchmarks/retail-demand/observable_baseline/official_holdout_v12.py'),
              'result_present':result.exists(),
              'result_sha256':hashlib.sha256(result.read_bytes()).hexdigest() if result.exists() else 'TBD',
              'temporal_holdout_independence':False,
              'real_evaluation_scope':'different stores; SAME already-inspected dates',
              'latent_demand_ground_truth':'UNAVAILABLE',
              'independent_external_review':'TBD'
          }
          (root/'store_disjoint_v15_provenance.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retail-store-disjoint-v15-aggregate
          path: artifacts/*.json
          retention-days: 14
          if-no-files-found: error
