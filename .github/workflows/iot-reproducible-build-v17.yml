name: ESP32-S3 controlled reproducible build v17 (unflashed)
on:
  pull_request:
    paths:
      - 'benchmarks/hardware-iot/firmware/espidf_dual_sensor_capture/**'
      - '.github/workflows/iot-reproducible-build-v17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-clean-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile twice in official ESP-IDF v6.1 container without flashing
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: benchmarks/hardware-iot/firmware/espidf_dual_sensor_capture
          command: >-
            sh -ec '
            mkdir -p repro_v17;
            idf.py --version > repro_v17/idf_version.txt;
            xtensa-esp32s3-elf-gcc --version | head -n 1 > repro_v17/compiler_version.txt;
            git rev-parse HEAD > repro_v17/checkout_sha.txt;
            idf.py build;
            grep -qx CONFIG_APP_REPRODUCIBLE_BUILD=y sdkconfig;
            grep -qx CONFIG_APP_PROJECT_VER_FROM_CONFIG=y sdkconfig;
            grep -qx CONFIG_APP_PROJECT_VER=\"iot-repro-v17\" sdkconfig;
            sha256sum sdkconfig > repro_v17/sdkconfig_sha256.txt;
            cp build/iot_dual_sensor_capture.bin repro_v17/app-first.bin;
            cp build/bootloader/bootloader.bin repro_v17/boot-first.bin;
            cp build/partition_table/partition-table.bin repro_v17/partition-first.bin;
            cp build/flasher_args.json repro_v17/flasher-first.json;
            idf.py fullclean;
            sleep 3;
            idf.py build;
            grep -qx CONFIG_APP_REPRODUCIBLE_BUILD=y sdkconfig;
            cp build/iot_dual_sensor_capture.bin repro_v17/app-second.bin;
            cp build/bootloader/bootloader.bin repro_v17/boot-second.bin;
            cp build/partition_table/partition-table.bin repro_v17/partition-second.bin;
            cp build/flasher_args.json repro_v17/flasher-second.json;
            cd repro_v17;
            sha256sum *.bin *.json > SHA256SUMS.txt;
            sha256sum --check SHA256SUMS.txt;
            if cmp -s app-first.bin app-second.bin && cmp -s boot-first.bin boot-second.bin && cmp -s partition-first.bin partition-second.bin && cmp -s flasher-first.json flasher-second.json; then echo MATCH > comparison_status.txt; else echo MISMATCH > comparison_status.txt; fi;
            cat comparison_status.txt;
            cat SHA256SUMS.txt;
            '
      - name: Preserve both unflashed builds and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iot-repro-v17-unflashed-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmarks/hardware-iot/firmware/espidf_dual_sensor_capture/repro_v17/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Gate on identical members, not ZIP metadata
        shell: bash
        run: |
          set -euo pipefail
          stage=benchmarks/hardware-iot/firmware/espidf_dual_sensor_capture/repro_v17
          test -s "$stage/checkout_sha.txt"
          test -s "$stage/sdkconfig_sha256.txt"
          (cd "$stage" && sha256sum --check SHA256SUMS.txt)
          test "$(cat "$stage/comparison_status.txt")" = MATCH
# No connected hardware, flashing, physical provenance or sensor measurements.
