name: Cooling synthetic-origin gate
on:
  pull_request:
    paths:
      - 'benchmarks/adaptive-cooling/fixture_origin_gate.py'
      - 'benchmarks/adaptive-cooling/test_fixture_origin_gate.py'
      - '.github/workflows/cooling-origin-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  origin-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run fictional-only origin gate regressions
        working-directory: benchmarks/adaptive-cooling
        run: python -B -m unittest -v test_fixture_origin_gate.py
