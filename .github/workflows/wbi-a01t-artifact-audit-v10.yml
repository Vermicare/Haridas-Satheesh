name: WBI A01T source artifact audit v1.0
on:
  push:
    branches: [research/wbi-independent-repro-20261026]
    paths:
      - 'benchmarks/wireless-brain-interface/bnci_a01t_artifact_audit_v10.py'
      - 'benchmarks/wireless-brain-interface/test_bnci_a01t_artifact_audit_v10.py'
      - '.github/workflows/wbi-a01t-artifact-audit-v10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-contract-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned read-only audit dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 scikit-learn==1.7.2
      - name: Fifteen fictional-only adversarial tests
        working-directory: benchmarks/wireless-brain-interface
        run: python -B -m unittest -v test_bnci_a01t_artifact_audit_v10
  training-only-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: fictional-contract-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned read-only audit dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 scikit-learn==1.7.2
      - name: Inspect public A01T artifact flags only; never A01E or trial labels
        run: >-
          python -B benchmarks/wireless-brain-interface/bnci_a01t_artifact_audit_v10.py
          --output "${{ runner.temp }}/wbi_a01t_artifact_audit_v10_aggregate.json"
      - name: Upload aggregate counts and logical bounds only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wbi-a01t-artifact-audit-v10-aggregate
          path: ${{ runner.temp }}/wbi_a01t_artifact_audit_v10_aggregate.json
          retention-days: 14
          if-no-files-found: error
