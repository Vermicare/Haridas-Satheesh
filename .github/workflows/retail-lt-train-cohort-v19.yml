name: Retail LT v1.9 TRAIN-only cohort gate (NO EVAL DOWNLOAD)
on:
  push:
    branches: [research/retail-store-disjoint-v15-20261027]
    paths:
      - '.github/workflows/retail-lt-train-cohort-v19.yml'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_train_cohort_v19.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_train_cohort_v19.py'
  pull_request:
    paths:
      - '.github/workflows/retail-lt-train-cohort-v19.yml'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_train_cohort_v19.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_train_cohort_v19.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ten fictional eligibility and label-firewall controls
        working-directory: benchmarks/retail-demand/observable_baseline
        run: python -B -m unittest -v test_freshretail_lt_train_cohort_v19
  publisher-train-only:
    runs-on: ubuntu-latest
    needs: fictional-contracts
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==20.0.0
      - name: Download only publisher TRAIN, never EVAL
        shell: bash
        run: |
          set -euo pipefail
          root='https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-LT/resolve/01c3bb306415e09d3ccd2fe762f33eb3aeb2affd/data'
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 900 --silent --show-error "$root/train.parquet" -o "$RUNNER_TEMP/lt_train.parquet"
          printf '%s  %s\n' 'e744c537ed16a8254c50f8456de7c5614866d4d8b6787e3cc3b67be02ea2f1e3' "$RUNNER_TEMP/lt_train.parquet" | sha256sum --check
      - name: Compute preregistered TRAIN-only cohort eligibility
        working-directory: benchmarks/retail-demand/observable_baseline
        shell: bash
        run: |
          set -euo pipefail
          python -B freshretail_lt_train_cohort_v19.py --train "$RUNNER_TEMP/lt_train.parquet" --output "$RUNNER_TEMP/lt_train_cohort_v19.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'lt_train_cohort_v19.json').read_text())
          assert r['evaluation_labels_read'] is False
          assert r['evaluation_file_opened'] is False
          print('TRAIN-only status:', r['status'], 'eligible:', r['eligible_complete_valid_series'])
          PY
      - name: Upload aggregate-only TRAIN provenance, never source rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-lt-v19-train-cohort-only
          path: ${{ runner.temp }}/lt_train_cohort_v19.json
          if-no-files-found: warn
          retention-days: 14
