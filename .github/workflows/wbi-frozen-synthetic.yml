name: WBI frozen synthetic cross-OS reproducibility
on:
  push:
    branches:
      - research/wbi-independent-repro-20261026
    paths:
      - '.github/workflows/wbi-frozen-synthetic.yml'
      - 'benchmarks/wireless-brain-interface/verify_frozen_synthetic.py'
      - 'benchmarks/wireless-brain-interface/synthetic_evaluator.py'
      - 'benchmarks/wireless-brain-interface/bnci2a_split_preflight.py'
      - 'benchmarks/wireless-brain-interface/test_bnci2a_split_preflight.py'
      - 'benchmarks/wireless-brain-interface/bnci2a_source_archive_preflight.py'
      - 'benchmarks/wireless-brain-interface/test_bnci2a_source_archive_preflight.py'
      - 'benchmarks/wireless-brain-interface/zhou2020_bids_channel_gate_v01.py'
      - 'benchmarks/wireless-brain-interface/test_zhou2020_bids_channel_gate_v01.py'
      - 'benchmarks/wireless-brain-interface/zhou2020_tree_inventory_v03.py'
      - 'benchmarks/wireless-brain-interface/test_zhou2020_tree_inventory_v03.py'
  pull_request:
    paths:
      - '.github/workflows/wbi-frozen-synthetic.yml'
      - 'benchmarks/wireless-brain-interface/verify_frozen_synthetic.py'
      - 'benchmarks/wireless-brain-interface/synthetic_evaluator.py'
      - 'benchmarks/wireless-brain-interface/bnci2a_split_preflight.py'
      - 'benchmarks/wireless-brain-interface/test_bnci2a_split_preflight.py'
      - 'benchmarks/wireless-brain-interface/bnci2a_source_archive_preflight.py'
      - 'benchmarks/wireless-brain-interface/test_bnci2a_source_archive_preflight.py'
      - 'benchmarks/wireless-brain-interface/zhou2020_bids_channel_gate_v01.py'
      - 'benchmarks/wireless-brain-interface/test_zhou2020_bids_channel_gate_v01.py'
      - 'benchmarks/wireless-brain-interface/zhou2020_tree_inventory_v03.py'
      - 'benchmarks/wireless-brain-interface/test_zhou2020_tree_inventory_v03.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-synthetic-reproduction:
    name: Frozen synthetic / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Preserve Git blob line endings on every runner
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify original source identity and twice-reproduced synthetic CSV
        shell: bash
        run: python -B benchmarks/wireless-brain-interface/verify_frozen_synthetic.py
      - name: Run fictional BNCI2a split integrity regressions (NO EEG)
        shell: bash
        run: python -B -m unittest discover -s benchmarks/wireless-brain-interface -p 'test_bnci2a_split_preflight.py' -v
      - name: Run synthetic ZIP source-integrity and label-firewall regressions (NO EEG)
        shell: bash
        run: python -B -m unittest discover -s benchmarks/wireless-brain-interface -p 'test_bnci2a_source_archive_preflight.py' -v
      - name: Run Zhou2020 corrected BIDS metadata contract regressions (NO EEG)
        shell: bash
        run: python -B -m unittest discover -s benchmarks/wireless-brain-interface -p 'test_zhou2020_bids_channel_gate_v01.py' -v
      - name: Run fictional Zhou2020 Git-tree inventory regressions (NO EEG)
        shell: bash
        run: python -B -m unittest discover -s benchmarks/wireless-brain-interface -p 'test_zhou2020_tree_inventory_v03.py' -v
      - name: Execute pinned public Zhou2020 Git-tree audit (metadata only)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B benchmarks/wireless-brain-interface/zhou2020_tree_inventory_v03.py > "$RUNNER_TEMP/zhou2020_tree_inventory_v03.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'zhou2020_tree_inventory_v03.json'
          d = json.loads(p.read_text(encoding='utf-8'))
          expected = {'schema': 'ZHOU2020_TREE_INVENTORY_V03', 'observed_subjects': 20, 'observed_session_directories': 139, 'observed_channel_metadata_files': 833, 'observed_event_metadata_files': 833, 'metadata_pairing': 'PASS', 'pinned_ref': 'a291ed8a2afab3f93b85a540134dceb98092fcaf'}
          for key, value in expected.items():
              if d.get(key) != value:
                  raise SystemExit(f'FAIL CLOSED: {key} observed {d.get(key)!r}, expected {value!r}')
          if d['absent_session_directories'] != [{'subject': 20, 'session': 6}]:
              raise SystemExit('FAIL CLOSED: missing-session inventory changed')
          if d['eeg_signals_read'] or d['trial_event_rows_read'] or d['publisher_checksum_verified']:
              raise SystemExit('FAIL CLOSED: evidence boundary unexpectedly changed')
          print('PASS: 20 subjects, 139 session directories, 833 paired metadata runs; no EEG read')
          PY
      - name: Preserve only derived public Git-tree metadata (no EEG)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zhou2020-git-tree-inventory-${{ matrix.os }}
          path: ${{ runner.temp }}/zhou2020_tree_inventory_v03.json
          retention-days: 14
          if-no-files-found: error
