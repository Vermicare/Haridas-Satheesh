name: Retail LT v1.8 source-byte acquisition (NO LABEL PARSING)
on:
  pull_request:
    paths:
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_source_gate_v18.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_source_gate_v18.py'
      - 'benchmarks/retail-demand/observable_baseline/FRESHRETAIL_LT_V18_PREREGISTRATION.md'
      - '.github/workflows/retail-lt-source-gate-v18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run seven fictional negative controls
        working-directory: benchmarks/retail-demand/observable_baseline
        run: python -B -m unittest -v test_freshretail_lt_source_gate_v18
      - name: Download immutable publisher bytes to temporary runner storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retail-lt"
          base="https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-LT/resolve/01c3bb306415e09d3ccd2fe762f33eb3aeb2affd/data"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 900 --silent --show-error "$base/train.parquet" -o "$RUNNER_TEMP/retail-lt/train.parquet"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 300 --silent --show-error "$base/eval.parquet" -o "$RUNNER_TEMP/retail-lt/eval.parquet"
      - name: Hash both original files without opening evaluation labels
        shell: bash
        working-directory: benchmarks/retail-demand/observable_baseline
        run: |
          set -euo pipefail
          python -B freshretail_lt_source_gate_v18.py \
            --train "$RUNNER_TEMP/retail-lt/train.parquet" \
            --eval "$RUNNER_TEMP/retail-lt/eval.parquet" \
            --output "$RUNNER_TEMP/retail-lt-source-gate-v18.json"
          python -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"retail-lt-source-gate-v18.json"); r=json.load(open(p)); assert r["evaluation_labels_read"] is False; print("Source bytes matched; no eval labels parsed; all forecast results TBD")'
      - name: Upload metadata-only provenance (no source Parquet)
        uses: actions/upload-artifact@v4
        with:
          name: retail-lt-v18-source-hashes-only
          path: ${{ runner.temp }}/retail-lt-source-gate-v18.json
          if-no-files-found: error
          retention-days: 14
