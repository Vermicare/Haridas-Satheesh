name: CORTEX fictional fixture integrity
on:
  pull_request:
    paths:
      - 'benchmarks/cortex/**'
      - '.github/workflows/cortex-fixture-integrity.yml'
  push:
    branches:
      - research/cortex-fixture-integrity-v04-20261023
    paths:
      - 'benchmarks/cortex/**'
      - '.github/workflows/cortex-fixture-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-fixture-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run fictional fixture integrity and archive negative controls
        shell: bash
        working-directory: benchmarks/cortex
        run: |
          python -B -m unittest -v fixture_integrity_preflight.py test_lineage_shift.py test_supersession_graph.py test_blind_review_preflight.py test_archive_citation_gate_v04.py test_prov_o_mapping_v01.py test_reviewer_pair_preflight_v01.py test_source_span_completeness_v01.py test_source_span_gold_coverage_v02.py test_semantic_annotation_contract_v02.py test_semantic_annotation_integration_v02.py test_reviewer_pair_semantic_gate_v03.py test_reviewer_pair_exact_disagreement_v04.py
          python -B demo_reviewer_pair_exact_disagreement_v04.py > cortex-exact-disagreement-v04.json
          python -c "import json; d=json.load(open('cortex-exact-disagreement-v04.json')); assert d['human_reviewers']==0 and d['external_actions']==0; assert d['matching']['pair_ready'] and not d['matching']['exact_disagreement_detected']; assert d['different_text']['field_mismatch_counts']['statement']==1; assert d['semantic_accuracy']=='TBD'"
          python -B blind_review_preflight.py manifest blind_case_20261024.json blind_archive_20261024.json
          python -B archive_citation_gate_v04.py demo
          python -B source_span_completeness_v01.py demo
          python -B source_span_gold_coverage_v02.py demo
          python -c "from source_span_gold_coverage_v02 import demo; d=demo(); assert d['original']['complete_clean_gate']; assert d['omitted']['gold_denominator_exact_ratio']==0.857143; assert not d['omitted']['complete_clean_gate']; assert not d['duplicate']['complete_clean_gate']"
          python -c "from source_span_completeness_v01 import demo; d=demo(); assert d['original']['counts']['exact']==7; assert d['omitted_source']['counts']['partial']==1; assert d['omitted_source']['strict_exact_source_ratio']==0.857143; assert d['frozen_evaluator_source_traceability_omitted']==1.0"
          python -c "import hashlib;from archive_citation_gate_v04 import demo;assert hashlib.sha256(demo().encode('utf-8')).hexdigest() == '76e54d346299c9a8bb0d2b3485eae6f5b0a834c27128135cf6302d458f44420a'"
          python -c "import hashlib,pathlib; a=pathlib.Path('blind_case_20261024.json').read_bytes(); b=pathlib.Path('blind_archive_20261024.json').read_bytes(); assert hashlib.sha256(a).hexdigest() == 'f6357accbd87e11ffcaf1a2d39a085b0611719de6953cd3e4789ccacbb96344d'; assert hashlib.sha256(b).hexdigest() == '897ba394a392ffd63b5561500e5350573570c835fc699c0fd453148d4e3c8046'"
          python -B run_lineage_shift.py
          python -c "import hashlib,pathlib; p=pathlib.Path('synthetic_lineage_shift_results.json'); assert hashlib.sha256(p.read_bytes()).hexdigest() == '2c3d060df1932318cc64dba980946ebaad3c47fd56a7509b488f9f53e2dc6180'"
      - name: Independently verify frozen fictional PROV projection v0.5
        shell: bash
        working-directory: benchmarks/cortex
        run: |
          python -B -m unittest -v test_cortex_prov_boundary_v05.py
          python -B -m unittest -v test_cortex_in_memory_boundary_v06.py
          python -B cortex_prov_boundary_v05.py export blind_case_20261024.json blind_archive_20261024.json > cortex-prov-v05.ttl
          python -m pip install --disable-pip-version-check rdflib==7.5.0
          python -c "import hashlib,pathlib; from rdflib import Graph; p=pathlib.Path('cortex-prov-v05.ttl'); b=p.read_bytes().replace(b'\r\n',b'\n'); assert hashlib.sha256(b).hexdigest() == '7cca1eea84e9ff8b916ee2a6ca8b73a0c3aeb047dafdcf521cc47d9d9ffbd9b0'; g=Graph(); g.parse(data=b.decode('utf-8'),format='turtle'); assert len(g)==14; assert not any(str(p).endswith(('wasRevisionOf','hadPrimarySource','wasInvalidatedBy')) for s,p,o in g); print('CORTEX_V05_VERIFIED: 14 triples, canonical SHA-256 pinned, forbidden PROV edges absent')"
      - name: Audit downstream frozen fictional RDF semantic contract v0.7
        shell: bash
        working-directory: benchmarks/cortex
        run: |
          python -B -m unittest -v test_cortex_graph_contract_v07.py
          python -B cortex_prov_boundary_v05.py export blind_case_20261024.json blind_archive_20261024.json > cortex-prov-v05.ttl
          python -B cortex_graph_contract_v07.py audit cortex-prov-v05.ttl > cortex-graph-contract-v07.json
          python -c "import json; d=json.load(open('cortex-graph-contract-v07.json')); assert d['valid'] is True and d['observed_triples']==14 and d['missing_triples']==0 and d['unexpected_triples']==0; print('CORTEX_V07_VERIFIED: frozen v0.5 exporter output passes independent RDF graph contract')"
      - name: Compare fictional graph traversal scaling (non-gating timing)
        shell: bash
        working-directory: benchmarks/cortex
        run: python -B benchmark_supersession_scaling.py
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-fictional-shift-${{ matrix.os }}
          path: |
            benchmarks/cortex/synthetic_lineage_shift_results.json
            benchmarks/cortex/cortex-exact-disagreement-v04.json
          if-no-files-found: error
