name: CORTEX fictional fixture integrity
on:
  pull_request:
    paths:
      - 'benchmarks/cortex/**'
      - '.github/workflows/cortex-fixture-integrity.yml'
  push:
    branches:
      - research/cortex-fixture-integrity-v04-20261023
    paths:
      - 'benchmarks/cortex/**'
      - '.github/workflows/cortex-fixture-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-fixture-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run fictional fixture integrity and archive negative controls
        shell: bash
        working-directory: benchmarks/cortex
        run: |
          python -B -m unittest -v fixture_integrity_preflight.py test_lineage_shift.py test_supersession_graph.py test_blind_review_preflight.py test_archive_citation_gate_v04.py test_prov_o_mapping_v01.py test_reviewer_pair_preflight_v01.py test_source_span_completeness_v01.py test_source_span_gold_coverage_v02.py test_semantic_annotation_contract_v02.py test_semantic_annotation_integration_v02.py
          python -B blind_review_preflight.py manifest blind_case_20261024.json blind_archive_20261024.json
          python -B archive_citation_gate_v04.py demo
          python -B source_span_completeness_v01.py demo
          python -B source_span_gold_coverage_v02.py demo
          python -c "from source_span_gold_coverage_v02 import demo; d=demo(); assert d['original']['complete_clean_gate']; assert d['omitted']['gold_denominator_exact_ratio']==0.857143; assert not d['omitted']['complete_clean_gate']; assert not d['duplicate']['complete_clean_gate']"
          python -c "from source_span_completeness_v01 import demo; d=demo(); assert d['original']['counts']['exact']==7; assert d['omitted_source']['counts']['partial']==1; assert d['omitted_source']['strict_exact_source_ratio']==0.857143; assert d['frozen_evaluator_source_traceability_omitted']==1.0"
          python -c "import hashlib;from archive_citation_gate_v04 import demo;assert hashlib.sha256(demo().encode('utf-8')).hexdigest() == '76e54d346299c9a8bb0d2b3485eae6f5b0a834c27128135cf6302d458f44420a'"
          python -c "import hashlib,pathlib; a=pathlib.Path('blind_case_20261024.json').read_bytes(); b=pathlib.Path('blind_archive_20261024.json').read_bytes(); assert hashlib.sha256(a).hexdigest() == 'f6357accbd87e11ffcaf1a2d39a085b0611719de6953cd3e4789ccacbb96344d'; assert hashlib.sha256(b).hexdigest() == '897ba394a392ffd63b5561500e5350573570c835fc699c0fd453148d4e3c8046'"
          python -B run_lineage_shift.py
          python -c "import hashlib,pathlib; p=pathlib.Path('synthetic_lineage_shift_results.json'); assert hashlib.sha256(p.read_bytes()).hexdigest() == '2c3d060df1932318cc64dba980946ebaad3c47fd56a7509b488f9f53e2dc6180'"
      - name: Compare fictional graph traversal scaling (non-gating timing)
        shell: bash
        working-directory: benchmarks/cortex
        run: python -B benchmark_supersession_scaling.py
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-fictional-shift-${{ matrix.os }}
          path: benchmarks/cortex/synthetic_lineage_shift_results.json
          if-no-files-found: error
