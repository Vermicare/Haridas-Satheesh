name: CORTEX fictional fixture integrity
on:
  pull_request:
    paths:
      - 'benchmarks/cortex/**'
      - '.github/workflows/cortex-fixture-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-fixture-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run fictional fixture integrity and archive negative controls
        shell: bash
        working-directory: benchmarks/cortex
        run: |
          python -B -m unittest -v fixture_integrity_preflight.py test_lineage_shift.py test_supersession_graph.py
          python -B run_lineage_shift.py
          python -c "import hashlib,pathlib; p=pathlib.Path('synthetic_lineage_shift_results.json'); assert hashlib.sha256(p.read_bytes()).hexdigest() == '2c3d060df1932318cc64dba980946ebaad3c47fd56a7509b488f9f53e2dc6180'"
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-fictional-shift-${{ matrix.os }}
          path: benchmarks/cortex/synthetic_lineage_shift_results.json
          if-no-files-found: error
