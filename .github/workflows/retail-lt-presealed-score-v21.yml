name: Retail LT v2.1 preregistered EVAL scoring after TRAIN-only re-seal
on:
  push:
    branches: [research/retail-store-disjoint-v15-20261027]
    paths:
      - '.github/workflows/retail-lt-presealed-score-v21.yml'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_score_v21.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_score_v21.py'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_secondary_v22.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_secondary_v22.py'
  pull_request:
    paths:
      - '.github/workflows/retail-lt-presealed-score-v21.yml'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_score_v21.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_score_v21.py'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_secondary_v22.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_secondary_v22.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-negative-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run fictional label firewall and estimand controls
        working-directory: benchmarks/retail-demand/observable_baseline
        run: python -B -m unittest -v test_freshretail_lt_score_v21 test_freshretail_lt_secondary_v22
  pinned-2025-temporal-transfer:
    needs: fictional-negative-controls
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==20.0.0
      - name: Download pinned TRAIN and EVAL to ephemeral private runner storage
        shell: bash
        run: |
          set -euo pipefail
          root='https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-LT/resolve/01c3bb306415e09d3ccd2fe762f33eb3aeb2affd/data'
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 900 --silent --show-error "$root/train.parquet" -o "$RUNNER_TEMP/lt_train.parquet"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 900 --silent --show-error "$root/eval.parquet" -o "$RUNNER_TEMP/lt_eval.parquet"
          printf '%s  %s\n' 'e744c537ed16a8254c50f8456de7c5614866d4d8b6787e3cc3b67be02ea2f1e3' "$RUNNER_TEMP/lt_train.parquet" | sha256sum --check
          printf '%s  %s\n' '370ca7f995d2a059744e1659eb681e60db694bec2f80a84252426afdd2b6d626' "$RUNNER_TEMP/lt_eval.parquet" | sha256sum --check
      - name: Independently re-seal TRAIN predictions BEFORE parsing EVAL labels
        working-directory: benchmarks/retail-demand/observable_baseline
        shell: bash
        run: |
          set -euo pipefail
          python -B freshretail_lt_score_v21.py --train "$RUNNER_TEMP/lt_train.parquet" --eval "$RUNNER_TEMP/lt_eval.parquet" --output "$RUNNER_TEMP/lt_v21_aggregate.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'lt_v21_aggregate.json').read_text())
          assert r['train_only_prediction_seal_regenerated_before_eval_labels'] is True
          assert r['original_and_independent_prediction_sha256'] == '5c21bce8c9a436ecc0d3173128b0812e4408cc025558faedc2ed0e3497a54e20'
          assert r['result']['selected_series'] == 512
          assert r['result']['expected_future_days'] == 3584
          assert r['result']['missing_future_days'] == 0
          assert r['result']['maturity_change'] == 'NONE'
          print('Preregistered decision:',r['result']['decision'])
          PY
      - name: Post-hoc strongest-simple-comparator sensitivity (NOT confirmatory)
        working-directory: benchmarks/retail-demand/observable_baseline
        shell: bash
        run: |
          set -euo pipefail
          python -B freshretail_lt_secondary_v22.py --train "$RUNNER_TEMP/lt_train.parquet" --eval "$RUNNER_TEMP/lt_eval.parquet" --output "$RUNNER_TEMP/lt_v22_exploratory.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'lt_v22_exploratory.json').read_text())
          assert r['original_v21_primary_gate'] == 'PASSED_UNCHANGED'
          assert r['original_v15_2024_primary_gate'] == 'FAILED_UNCHANGED'
          assert r['frozen_prediction_sha256'] == '5c21bce8c9a436ecc0d3173128b0812e4408cc025558faedc2ed0e3497a54e20'
          assert r['scored_in_stock_days'] == 1766 and r['stockout_censored_days'] == 1818
          assert r['maturity_change'] == 'NONE'
          print('Post-hoc secondary:',r['exploratory_secondary']['decision'])
          PY
      - name: Upload exploratory aggregate-only sensitivity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-lt-v22-exploratory-aggregate
          path: ${{ runner.temp }}/lt_v22_exploratory.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload aggregate-only evidence; never raw publisher data or predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-lt-v21-aggregate-score
          path: ${{ runner.temp }}/lt_v21_aggregate.json
          if-no-files-found: warn
          retention-days: 14
