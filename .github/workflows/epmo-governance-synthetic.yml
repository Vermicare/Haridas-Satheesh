name: EPMO fictional governance contract
on:
  pull_request:
    paths:
      - 'benchmarks/epmo-governance/**'
      - '.github/workflows/epmo-governance-synthetic.yml'
  push:
    paths:
      - 'benchmarks/epmo-governance/**'
      - '.github/workflows/epmo-governance-synthetic.yml'
permissions:
  contents: read
jobs:
  fictional-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run adversarial tests
        working-directory: benchmarks/epmo-governance
        run: python -m unittest discover -v
      - name: Produce deterministic fictional receipt
        run: python benchmarks/epmo-governance/governance_demo.py benchmarks/epmo-governance/synthetic_scenario.json --output demo_result.json
      - name: Verify receipt structure
        run: python -c "import json; x=json.load(open('demo_result.json')); assert (x['accepted'],x['rejected'],x['external_actions']) == (4,2,0)"
