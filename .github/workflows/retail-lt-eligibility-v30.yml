name: Retail LT v3.0 eligibility mask fictional contract
on:
  push:
    branches: [research/retail-store-disjoint-v15-20261027]
    paths:
      - '.github/workflows/retail-lt-eligibility-v30.yml'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_eligibility_contract_v30.py'
      - 'benchmarks/retail-demand/observable_baseline/test_freshretail_lt_eligibility_contract_v30.py'
      - 'benchmarks/retail-demand/observable_baseline/freshretail_lt_full_target_gate_v27.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test fictional-only coverage and eligibility contracts
        working-directory: benchmarks/retail-demand/observable_baseline
        run: |
          python -B -m unittest -v test_freshretail_lt_full_target_gate_v27 test_freshretail_lt_eligibility_contract_v30
      - name: Assert no publisher evaluation labels, predictions, or data downloaded
        shell: python
        run: |
          print("FICTIONAL_MASK_CONTRACT_ONLY; REAL_SCORING=TBD; NO_DATA_DOWNLOAD")
