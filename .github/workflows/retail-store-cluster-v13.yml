name: Retail v1.3 store-cluster uncertainty sensitivity
on:
  push:
    branches:
      - research/retail-observable-baseline-20261024
    paths:
      - '.github/workflows/retail-store-cluster-v13.yml'
      - 'benchmarks/retail-demand/observable_baseline/cluster_sensitivity_v13.py'
      - 'benchmarks/retail-demand/observable_baseline/test_cluster_sensitivity_v13.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-cluster-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test frozen contract and cluster sensitivity negative controls
        working-directory: benchmarks/retail-demand/observable_baseline
        run: python -B -m unittest -v test_official_holdout_v12 test_cluster_sensitivity_v13
      - name: Install pinned Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==20.0.0
      - name: Require original frozen evaluator and original result identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:benchmarks/retail-demand/observable_baseline/official_holdout_v12.py)" = ddd12a4e0695c474f752d98c99fd781931373bce
          test "$(git rev-parse HEAD:benchmarks/retail-demand/observable_baseline/OFFICIAL_HOLDOUT_V12_RESULT.json)" = 3a914fc3834759fabde9bb0fd2f524e7cfd162ab
          mkdir -p artifacts
      - name: Acquire publisher splits with original pinned-byte verification
        shell: bash
        run: |
          set -euo pipefail
          root='https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-50K/resolve/08c1fab7f9257bc73679d415d644165d351d4/data'
          for split in train eval; do
            if curl --fail --location --retry 1 --connect-timeout 20 --max-time 900 "$root/$split.parquet" --output "$RUNNER_TEMP/$split.parquet"; then
              echo "$split immutable revision URL succeeded"
            else
              echo "::warning::$split immutable revision unavailable; fallback allowed only with identical pinned bytes"
              curl --fail --location --retry 2 --connect-timeout 20 --max-time 900 "https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-50K/resolve/main/data/$split.parquet" --output "$RUNNER_TEMP/$split.parquet"
            fi
          done
          printf '%s  %s\n' '6706832db892bbae4969c19d87e07975d2543d2ba7d7d4756360654785de5a3d' "$RUNNER_TEMP/train.parquet" | sha256sum --check
          printf '%s  %s\n' '1b118840664280c6b88bffc84c80ee1f54c05d911e354b7599e5da10995e960e' "$RUNNER_TEMP/eval.parquet" | sha256sum --check
      - name: Compute post-hoc store-clustered interval with unchanged v1.2 model
        shell: bash
        run: |
          set -euo pipefail
          python -B benchmarks/retail-demand/observable_baseline/cluster_sensitivity_v13.py --train "$RUNNER_TEMP/train.parquet" --eval "$RUNNER_TEMP/eval.parquet" --output artifacts/cluster_sensitivity_v13_result.json
      - name: Preserve aggregate-only provenance and artifact hashes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          root=Path('artifacts'); root.mkdir(exist_ok=True)
          result=root/'cluster_sensitivity_v13_result.json'
          import subprocess
          def blob(path):
              return subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          record={'experiment_id':'retail-store-cluster-sensitivity-v13',
                  'analysis_type':'POST_HOC_SENSITIVITY_NOT_NEW_HOLDOUT',
                  'run_id':os.environ.get('GITHUB_RUN_ID','TBD'),
                  'head_commit':os.environ.get('GITHUB_SHA','TBD'),
                  'python':sys.version,'os':platform.platform(),
                  'new_source_blob':blob('benchmarks/retail-demand/observable_baseline/cluster_sensitivity_v13.py'),
                  'original_source_blob':blob('benchmarks/retail-demand/observable_baseline/official_holdout_v12.py'),
                  'result_present':result.exists(),
                  'result_sha256':hashlib.sha256(result.read_bytes()).hexdigest() if result.exists() else 'TBD',
                  'latent_demand_ground_truth':'UNAVAILABLE',
                  'independent_external_validation':'TBD'}
          (root/'cluster_sensitivity_v13_provenance.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retail-store-cluster-v13-aggregate
          path: artifacts/*.json
          retention-days: 14
          if-no-files-found: error
