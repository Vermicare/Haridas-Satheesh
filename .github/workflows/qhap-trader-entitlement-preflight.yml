name: QHAP entitlement receipt fail-closed synthetic gate
on:
  pull_request:
    paths:
      - 'projects/qhap-trader/experiments/validate_entitlement_receipt.mjs'
      - '.github/workflows/qhap-trader-entitlement-preflight.yml'
  push:
    paths:
      - 'projects/qhap-trader/experiments/validate_entitlement_receipt.mjs'
      - '.github/workflows/qhap-trader-entitlement-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source and run synthetic self-test
        shell: bash
        run: |
          set -euo pipefail
          node --version
          sha256sum projects/qhap-trader/experiments/validate_entitlement_receipt.mjs
          node projects/qhap-trader/experiments/validate_entitlement_receipt.mjs --self-test
